name: Deploy to GitHub Pages

# Builds the PWA with the correct base path (/<repo>/) and publishes it to
# GitHub Pages. In the repo: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - master
      - claude/study-timer-implementation-q8jqn4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Custom domain serves at the root ("/"); the github.io project site
          # serves under "/<repo>/". Set repo variable CUSTOM_DOMAIN to switch.
          VITE_BASE: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          # Set repo variable VITE_API_BASE (Settings → Secrets and variables →
          # Actions → Variables) to your Worker URL to connect Notion. Empty =
          # offline mock data.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Add CNAME for custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
